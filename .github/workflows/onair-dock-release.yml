name: OnAir Dock – build Windows installer

on:
  push:
    tags: ['onair-v*']      # e.g. git tag onair-v0.1.0 && git push origin onair-v0.1.0
  workflow_dispatch:         # or run it by hand from the Actions tab

permissions:
  contents: write            # needed to attach the installer to a GitHub Release

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: onair-dock
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: onair-dock/package-lock.json

      - run: npm ci

      - run: npm test

      - name: Build installer (fails if licensing or the Stripe link isn't set up)
        run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: OnAir-Dock-installer
          path: onair-dock/dist/*.exe

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/onair-v')
        uses: softprops/action-gh-release@v2
        with:
          files: onair-dock/dist/*.exe
