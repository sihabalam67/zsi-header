<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6efe4"/><stop offset="1" stop-color="#ead9c4"/></linearGradient><radialGradient id="glow" cx=".5" cy=".55" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#5b3b22" flood-opacity=".18"/></filter></defs><rect width="800" height="800" fill="url(#bg)"/><circle cx="400" cy="440" r="330" fill="url(#glow)"/><text x="400" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="44" fill="#1f2a2e">The 10-minute nightly hunt</text>
<g font-family="Helvetica, Arial, sans-serif" fill="#1f2a2e"><g transform="translate(150 360)"><circle r="88" fill="#fff" filter="url(#sh)"/><text y="16" text-anchor="middle" font-size="54" font-weight="700" fill="#e2673a">1</text><text y="150" text-anchor="middle" font-size="32" font-weight="700">Stalk</text><text y="190" text-anchor="middle" font-size="22" fill="#5d6b70">Lure darts away</text></g>
<g transform="translate(400 360)"><circle r="88" fill="#fff" filter="url(#sh)"/><text y="16" text-anchor="middle" font-size="54" font-weight="700" fill="#e2673a">2</text><text y="150" text-anchor="middle" font-size="32" font-weight="700">Pounce</text><text y="190" text-anchor="middle" font-size="22" fill="#5d6b70">Pause, then go</text></g>
<g transform="translate(650 360)"><circle r="88" fill="#fff" filter="url(#sh)"/><text y="16" text-anchor="middle" font-size="54" font-weight="700" fill="#e2673a">3</text><text y="150" text-anchor="middle" font-size="32" font-weight="700">Catch</text><text y="190" text-anchor="middle" font-size="22" fill="#5d6b70">Then a treat</text></g></g>
<path d="M245 360 H 305 M495 360 H 555" stroke="#e2673a" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 14"/></svg>