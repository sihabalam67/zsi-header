<!doctype html>
<html><head><meta charset="utf-8">
<!-- Daily Short Nov 28 (from ep14): "The comeback math". Penny Storybook, 1080x1920. Device: the Seesaw (a loss on one
     side, the climb back on the other) + coins halving and doubling. Data: channel/data/ep14.json. -->
<style>
@font-face{font-family:P;src:url(file:///root/.fonts/Poppins-900.ttf);font-weight:900}
@font-face{font-family:P;src:url(file:///root/.fonts/Poppins-700.ttf);font-weight:700}
html,body{margin:0;background:#000;overflow:hidden} svg{display:block} text{font-family:P;font-weight:900}
</style></head><body>
<svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF6E2"/><stop offset=".6" stop-color="#FFE3B8"/><stop offset="1" stop-color="#FFC98A"/></linearGradient>
 <radialGradient id="coin" cx=".36" cy=".3" r=".8"><stop offset="0" stop-color="#FFF4B8"/><stop offset=".35" stop-color="#FFD54A"/><stop offset=".8" stop-color="#F2A81D"/><stop offset="1" stop-color="#D98C0C"/></radialGradient>
 <radialGradient id="nv" cx=".36" cy=".3" r=".8"><stop offset="0" stop-color="#D9FFB0"/><stop offset=".4" stop-color="#76B900"/><stop offset="1" stop-color="#3E6B00"/></radialGradient>
 <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#5a2a0a" flood-opacity=".28"/></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
</defs><g id="root"></g></svg>
<script src="../../motion/kit.js"></script>
<script>const f=n=>(+n).toFixed(1);</script>
<script src="../../motion/penny.js"></script>
<script>
let TL=null;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), seg=(t,a,b)=>clamp((t-a)/(b-a)), lerp=(a,b,k)=>a+(b-a)*k;
const eout=x=>1-Math.pow(1-x,3);
const pop=(t,a)=>{const x=t-a;if(x<=0)return 0;return 1-Math.exp(-7*x)*Math.cos(10*x);};
function big(x,y,txt,size,col,k){ if(k<=0) return ''; return `<g transform="translate(${f(x)} ${f(y)}) scale(${f(k)})" filter="url(#sh)"><text text-anchor="middle" font-size="${size}" fill="${col}" stroke="#fff" stroke-width="${size*.14}" stroke-linejoin="round" paint-order="stroke">${txt}</text></g>`; }
function label(x,y,txt,size,fg,bg,k){ if(k<=0) return ''; const w=txt.length*size*.62+60; return `<g transform="translate(${f(x)} ${f(y)}) scale(${f(k)})" filter="url(#sh)"><rect x="${-w/2}" y="${-size*.85}" width="${w}" height="${size*1.4}" rx="${size*.35}" fill="${bg}"/><text text-anchor="middle" y="${size*.12}" font-size="${size}" fill="${fg}">${txt}</text></g>`; }
function captions(t){
  let line=null; for(const l of TL.lines) if(t>=l.start-.05&&t<=l.start+l.dur+.25) line=l; if(!line) return '';
  const ws=line.words; let i=ws.findIndex(w=>t<w.e); if(i<0) i=ws.length-1; const a=Math.max(0,i-(i%3)), chunk=ws.slice(a,a+3);
  const txt=chunk.map((w,j)=>`<tspan fill="${a+j===i?'#FFD21F':'#fff'}">${w.w.toUpperCase()}</tspan>`).join(' ');
  return `<text x="540" y="1420" text-anchor="middle" font-size="80" stroke="#2a1608" stroke-width="18" stroke-linejoin="round" paint-order="stroke">${txt}</text>`;
}

function coins(t,n,fadeFrom,fadeK,x0,y0){ // n coins in rows of 10; coins >= fadeFrom fade by fadeK
  let g=''; const s=78;
  for(let i=0;i<n;i++){ const r=Math.floor(i/10),c=i%10,k=clamp(pop(t,.2+i*.008)); const op=i>=fadeFrom?1-fadeK*.9:1;
    g+=`<circle cx="${x0+c*s}" cy="${y0+r*s}" r="${f(31*k)}" fill="url(#coin)" stroke="#B87F0E" stroke-width="4" opacity="${f(op)}"/>`; }
  return g;
}
function seesaw(t,a,left,right,tilt){ // tilt>0 = right side down
  const ang=tilt*14, cx=540, cy=900;
  let g=`<path d="M${cx-70} ${cy+170} L${cx} ${cy+20} L${cx+70} ${cy+170}Z" fill="#8B5A2B"/>`;
  g+=`<g transform="rotate(${f(ang)} ${cx} ${cy})"><rect x="${cx-420}" y="${cy-14}" width="840" height="28" rx="14" fill="#5a2f12"/>`;
  g+=big(cx-300,cy-80,left,110,'#D7261E',clamp(pop(t,a+.2)))+big(cx+300,cy-80,right,110,'#11885A',clamp(pop(t,a+1.1)))+'</g>';
  return g;
}
function frame(t){
  const L=TL.lines.map(l=>l.start);
  let g=`<rect width="1080" height="1920" fill="url(#sky)"/>`;
  if(t<L[1]-.1){ // hook: the lopsided seesaw
    g+=label(540,250,'THE COMEBACK MATH',66,'#fff','#2b1a0e',clamp(pop(t,.1)));
    g+=seesaw(t,0,'−50%','+100%',eout(seg(t,1.4,2.6)));
    g+=`<text x="540" y="1200" text-anchor="middle" font-size="52" fill="#5a2f12" opacity="${f(seg(t,2.4,3))}">just to get back to even</text>`;
  } else if(t<L[2]-.1){ // $100 -> $50
    const k=eout(seg(t,L[1]+1.6,L[1]+2.8));
    g+=label(540,250,k<.5?'START: $100':'NOW: $50',72,'#fff',k<.5?'#2b1a0e':'#D7261E',1);
    g+=coins(t-L[1],100,50,k,189,420);
    g+=big(540,1250,'$'+Math.round(lerp(100,50,k)),150,k<.5?'#2b1a0e':'#D7261E',clamp(pop(t,L[1]+.2)));
  } else if(t<L[3]-.1){ // $50 must double
    const k=eout(seg(t,L[2]+.8,L[2]+2.6));
    g+=label(540,250,'$50 MUST DOUBLE',72,'#fff','#11885A',1);
    g+=coins(99,100,Math.round(lerp(50,100,k)),1,189,420);
    g+=big(540,1250,'×2 = +100%',130,'#11885A',clamp(pop(t,L[2]+1.2)));
  } else if(t<L[4]-.1){ // Nvidia fall
    const k=eout(seg(t,L[3]+.2,L[3]+1.6));
    g+=label(540,250,'NVIDIA SINCE OCT 6',62,'#fff','#2b1a0e',1);
    g+=`<g transform="translate(540 ${f(lerp(560,900,k))}) rotate(${f(lerp(0,8,k))})" filter="url(#sh)"><path d="M-90 -150 h180 v170 h90 L0 160 L-90 20 h-90 v0 h90Z" fill="#D7261E"/></g>`;
    g+=big(540,1230,'−37.6%',180,'#D7261E',clamp(pop(t,L[3]+1)));
  } else if(t<L[5]-.1){ // the climb back
    const k=eout(seg(t,L[4]+1.2,L[4]+5.5)), h0=560*149.30/239.24, h=lerp(h0,560,k);
    g+=label(540,250,'THE CLIMB BACK',66,'#fff','#11885A',1);
    g+=`<line x1="250" y1="${1180-560}" x2="830" y2="${1180-560}" stroke="#5a2f12" stroke-width="5" stroke-dasharray="18 14"/>`;
    g+=`<text x="375" y="${1180-510}" text-anchor="end" font-size="40" fill="#5a2f12">OCT HIGH</text>`;
    g+=`<rect x="390" y="${f(1180-h)}" width="300" height="${f(h)}" rx="18" fill="${k>.98?'#11885A':'#F2A81D'}"/>`;
    g+=big(540,f(1180-h-40),'$'+lerp(149.30,239.24,k).toFixed(2),70,'#2b1a0e',clamp(pop(t,L[4]+.3)));
    g+=big(540,1290,'+'+(60.2*k).toFixed(1)+'%',130,'#11885A',clamp(pop(t,L[4]+1.2)));
  } else if(t<L[6]-.1){ // lopsided table
    g+=label(540,250,'LOSE THIS → NEED THIS',60,'#fff','#2b1a0e',1);
    const rows=[[10,11,0.6],[50,100,2.2],[80,400,4.2]];
    rows.forEach(([lo,up,at],i)=>{ const k=clamp(pop(t,L[5]+at)), y=480+i*260, w=eout(seg(t,L[5]+at,L[5]+at+1.2));
      g+=big(230,y+40,'−'+lo+'%',90,'#D7261E',k);
      g+=`<rect x="380" y="${y-20}" width="${f(Math.max(8,330*w*up/400))}" height="80" rx="16" fill="#11885A" opacity="${f(k)}"/>`;
      g+=big(380+Math.max(8,330*w*up/400)+130,y+40,'+'+up+'%',70,'#11885A',k); });
  } else { // end card
    const k=clamp(pop(t,L[6]));
    g+=label(540,300,'WHICH HURTS MORE?',80,'#fff','#2b1a0e',k);
    g+=label(310,600,'THE DROP',72,'#fff','#D7261E',clamp(pop(t,L[6]+.4)))+label(770,600,'THE WAIT',72,'#fff','#11885A',clamp(pop(t,L[6]+.7)));
    g+=`<text x="540" y="860" text-anchor="middle" font-size="50" fill="#5a2f12" opacity="${f(k)}">Full Nvidia breakdown on Coin Theory</text>`;
  }
  const fr=Math.min(TL.mouth.length-1,Math.round(t*30));
  g+=`<g filter="url(#sh)">${penny({x:190,y:1720,r:115,t,mood:t>=L[3]&&t<L[4]?'worried':'happy',mouth:TL.mouth[fr],blink:(t%3.6)<.12,armL:200,armR:-20})}</g>`;
  g+=captions(t);
  g+=`<text x="540" y="1890" text-anchor="middle" font-size="24" fill="#7a6650">Nvidia closes from Yahoo Finance (Oct 6 and Nov 25, 2026) · education only</text>`;
  document.getElementById('root').innerHTML=g;
}
window.setup=tl=>{TL=tl;}; window.frame=frame;
</script></body></html>
