<!doctype html>
<html><head><meta charset="utf-8">
<!-- Thanksgiving Short (Nov 25, 2026). Penny Storybook, 1080x1920. Device: Receipt & Recipe (the dinner receipt prints
     item by item; up items red, down items green). Data: AFBF 2026 survey (see voice.py). -->
<style>
@font-face{font-family:P;src:url(file:///root/.fonts/Poppins-900.ttf);font-weight:900}
@font-face{font-family:P;src:url(file:///root/.fonts/Poppins-700.ttf);font-weight:700}
html,body{margin:0;background:#000;overflow:hidden} svg{display:block} text{font-family:P;font-weight:900}
</style></head><body>
<svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE9C7"/><stop offset=".6" stop-color="#FFC98A"/><stop offset="1" stop-color="#F59E4C"/></linearGradient>
 <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#5a2a0a" flood-opacity=".3"/></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
</defs><g id="root"></g></svg>
<script src="../../motion/kit.js"></script>
<script>const f=n=>(+n).toFixed(1);</script>
<script src="../../motion/penny.js"></script>
<script>
let TL=null;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), seg=(t,a,b)=>clamp((t-a)/(b-a)), lerp=(a,b,k)=>a+(b-a)*k;
const eout=x=>1-Math.pow(1-x,3);
const pop=(t,a)=>{const x=t-a;if(x<=0)return 0;return 1-Math.exp(-7*x)*Math.cos(10*x);};
function big(x,y,txt,size,col,k){ if(k<=0) return ''; return `<g transform="translate(${f(x)} ${f(y)}) scale(${f(k)})" filter="url(#sh)"><text text-anchor="middle" font-size="${size}" fill="${col}" stroke="#fff" stroke-width="${size*.14}" stroke-linejoin="round" paint-order="stroke">${txt}</text></g>`; }
function label(x,y,txt,size,fg,bg,k){ if(k<=0) return ''; const w=txt.length*size*.62+60; return `<g transform="translate(${f(x)} ${f(y)}) scale(${f(k)})" filter="url(#sh)"><rect x="${-w/2}" y="${-size*.85}" width="${w}" height="${size*1.4}" rx="${size*.35}" fill="${bg}"/><text text-anchor="middle" y="${size*.12}" font-size="${size}" fill="${fg}">${txt}</text></g>`; }
function turkey(x,y,s,t){ const b=Math.sin(t*3)*3; return `<g transform="translate(${x} ${y+b}) scale(${s})" filter="url(#sh)">
  <ellipse cx="0" cy="40" rx="190" ry="40" fill="#fff" stroke="#c9b9a0" stroke-width="6"/>
  <path d="M-150 20 Q-160 -110 0 -120 Q160 -110 150 20 Z" fill="#C9772F" stroke="#7a3f12" stroke-width="8"/>
  <path d="M-110 -40 Q-60 -90 0 -95" stroke="#E9A35A" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M140 -10 L210 -60 Q235 -70 228 -45 L165 15Z" fill="#C9772F" stroke="#7a3f12" stroke-width="7"/><circle cx="225" cy="-58" r="16" fill="#FFF5E6" stroke="#7a3f12" stroke-width="5"/>
  <path d="M-140 -10 L-210 -60 Q-235 -70 -228 -45 L-165 15Z" fill="#C9772F" stroke="#7a3f12" stroke-width="7"/><circle cx="-225" cy="-58" r="16" fill="#FFF5E6" stroke="#7a3f12" stroke-width="5"/></g>`; }
const UP=new Set(['16-lb turkey','Cranberries','Gallon of milk','Dinner rolls']), DOWN=new Set(['Veggie tray','Pie crusts','Frozen peas']);
function receipt(t,L,shown,hi){
  const items=TL.items, n=Math.min(items.length,shown); const x0=210,w=660,top=330;
  let g=`<g filter="url(#sh)"><path d="M${x0} ${top} h${w} v${110+n*62} l-30 18 l-30 -18 l-30 18 l-30 -18 l-30 18 l-30 -18 l-30 18 l-30 -18 l-30 18 l-30 -18 l-30 18 l-30 -18 l-30 18 l-30 -18 l-30 18 l-30 -18 l-30 18 l-30 -18 l-30 18 l-30 -18 l-30 18 l-30 -18 V${top}Z" fill="#FFFDF7"/></g>`;
  g+=`<text x="540" y="${top+70}" text-anchor="middle" font-size="44" fill="#2b1a0e">THANKSGIVING FOR 10</text>`;
  for(let i=0;i<n;i++){ const [nm,p]=items[i], y=top+140+i*62; let col='#2b1a0e';
    if(hi==='up'&&UP.has(nm)) col='#D7261E'; if(hi==='down'&&DOWN.has(nm)) col='#11885A';
    const fs=nm==='16-lb turkey'?40:34;
    g+=`<text x="${x0+34}" y="${y}" font-size="${fs}" font-weight="700" fill="${col}">${nm}${hi==='up'&&UP.has(nm)?' ▲':''}${hi==='down'&&DOWN.has(nm)?' ▼':''}</text><text x="${x0+w-34}" y="${y}" text-anchor="end" font-size="${fs}" fill="${col}">$${p.toFixed(2)}</text>`; }
  return g;
}
function captions(t){
  let line=null; for(const l of TL.lines) if(t>=l.start-.05&&t<=l.start+l.dur+.25) line=l; if(!line) return '';
  const ws=line.words; let i=ws.findIndex(w=>t<w.e); if(i<0) i=ws.length-1; const a=Math.max(0,i-(i%3)), chunk=ws.slice(a,a+3);
  const txt=chunk.map((w,j)=>`<tspan fill="${a+j===i?'#FFD21F':'#fff'}">${w.w.toUpperCase()}</tspan>`).join(' ');
  return `<text x="540" y="1420" text-anchor="middle" font-size="80" stroke="#2a1608" stroke-width="18" stroke-linejoin="round" paint-order="stroke">${txt}</text>`;
}
function frame(t){
  const L=TL.lines.map(l=>l.start);
  let g=`<rect width="1080" height="1920" fill="url(#sky)"/><rect y="1180" width="1080" height="740" fill="#8B5A2B"/><rect y="1180" width="1080" height="24" fill="#6E3F1C"/>`;
  if(t<L[2]-.1){ // the total
    g+=turkey(540,1050,1.5,t);
    g+=label(540,250,'THANKSGIVING 2026',62,'#fff','#7a3f12',clamp(pop(t,.2)));
    const v=58.63*eout(seg(t,.6,2.2)); g+=big(540,520,'$'+v.toFixed(2),190,'#D7261E',clamp(pop(t,.5)));
    g+=`<text x="540" y="620" text-anchor="middle" font-size="46" fill="#5a2f12" opacity="${f(seg(t,1,1.6))}">dinner for 10 people</text>`;
    if(t>L[1]-.1) g+=label(540,760,'≈ $5.86 A PLATE',64,'#fff','#11885A',clamp(pop(t,L[1])));
  } else if(t<L[5]-.1){ // the receipt prints
    const shown=Math.floor(1+11*seg(t,L[2]+1.2,L[3]+.5)); const hi=t>=L[4]-.1?'down':t>=L[3]-.1?'up':'';
    g+=receipt(t,L,t<L[3]-.1?Math.max(1,Math.min(shown,1+Math.floor((t-L[2])*0)) ):shown,hi);
    if(t<L[3]-.1){ g+=label(540,250,'TURKEY ▲ 10%',72,'#fff','#D7261E',clamp(pop(t,L[2]+.3))); g+=turkey(540,1050,1.2,t); }
    else if(t<L[4]-.1) g+=label(540,250,'WENT UP ▲',72,'#fff','#D7261E',clamp(pop(t,L[3])));
    else g+=label(540,250,'GOT CHEAPER ▼',72,'#fff','#11885A',clamp(pop(t,L[4])));
  } else if(t<L[6]-.1){ // vs record
    const k=clamp(pop(t,L[5])); const h1=58.63/64.05*560*eout(seg(t,L[5]+.3,L[5]+1.3)), h2=560*eout(seg(t,L[5]+.3,L[5]+1.3));
    g+=label(540,250,'STILL BELOW THE RECORD',58,'#fff','#11885A',k);
    g+=`<rect x="250" y="${1120-h2}" width="230" height="${h2}" rx="14" fill="#B8B0A0"/><rect x="600" y="${1120-h1}" width="230" height="${h1}" rx="14" fill="#D7261E"/>`;
    g+=big(365,1120-h2-40,'$64.05',72,'#5a4a3a',k)+big(715,1120-h1-40,'$58.63',72,'#D7261E',k);
    g+=`<text x="365" y="1165" text-anchor="middle" font-size="44" fill="#fff">2022</text><text x="715" y="1165" text-anchor="middle" font-size="44" fill="#fff">2026</text>`;
    g+=label(540,1290,'$5.42 LESS',64,'#fff','#11885A',clamp(pop(t,L[5]+1.4)));
  } else { // end card
    const k=clamp(pop(t,L[6]));
    g+=turkey(540,1050,1.5,t)+label(540,260,'HAPPY THANKSGIVING',66,'#fff','#7a3f12',k);
    g+=`<text x="540" y="430" text-anchor="middle" font-size="54" fill="#5a2f12" opacity="${f(k)}">Which dish would you never skip?</text>`;
  }
  const fr=Math.min(TL.mouth.length-1,Math.round(t*30));
  g+=`<g filter="url(#sh)">${penny({x:190,y:1720,r:115,t,mood:'happy',mouth:TL.mouth[fr],blink:(t%3.6)<.12,armL:200,armR:-20})}</g>`;
  g+=captions(t);
  document.getElementById('root').innerHTML=g;
}
window.setup=tl=>{TL=tl;}; window.frame=frame;
</script></body></html>
