<!doctype html>
<html><head><meta charset="utf-8">
<!-- Daily Short Nov 25: "The cookie-jar thousand" (from story #1). Penny Storybook, 1080x1920. Device: Receipt & Recipe
     (the shopping cart empties) + the Inflation mouse. Timed from timeline.json line starts. -->
<style>
@font-face{font-family:P;src:url(file:///root/.fonts/Poppins-900.ttf);font-weight:900}
@font-face{font-family:P;src:url(file:///root/.fonts/Poppins-700.ttf);font-weight:700}
html,body{margin:0;background:#000;overflow:hidden}
svg{display:block} text{font-family:P;font-weight:900}
</style></head><body>
<svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF3DC"/><stop offset=".6" stop-color="#FFD9B5"/><stop offset="1" stop-color="#FFB98F"/></linearGradient>
 <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E8FFF1"/><stop offset=".6" stop-color="#BFF0D2"/><stop offset="1" stop-color="#8FDDB0"/></linearGradient>
 <radialGradient id="coin" cx=".36" cy=".3" r=".8"><stop offset="0" stop-color="#FFF4B8"/><stop offset=".35" stop-color="#FFD54A"/><stop offset=".8" stop-color="#F2A81D"/><stop offset="1" stop-color="#D98C0C"/></radialGradient>
 <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#5a2a0a" flood-opacity=".28"/></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
</defs><g id="root"></g></svg>
<script src="../../motion/kit.js"></script>
<script>const f=n=>(+n).toFixed(1);</script>
<script src="../../motion/penny.js"></script>
<script src="../../motion/cast.js"></script>
<script>
let TL=null;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), seg=(t,a,b)=>clamp((t-a)/(b-a)), lerp=(a,b,k)=>a+(b-a)*k;
const eout=x=>1-Math.pow(1-x,3), eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const pop=(t,a)=>{const x=t-a;if(x<=0)return 0;return 1-Math.exp(-7*x)*Math.cos(10*x);};
function big(x,y,txt,size,col,k,rot=0){ if(k<=0) return ''; return `<g transform="translate(${f(x)} ${f(y)}) rotate(${rot}) scale(${f(k)})" filter="url(#sh)"><text text-anchor="middle" font-size="${size}" fill="${col}" stroke="#fff" stroke-width="${size*.14}" stroke-linejoin="round" paint-order="stroke">${txt}</text></g>`; }
function label(x,y,txt,size,fg,bg,k){ if(k<=0) return ''; const w=txt.length*size*.62+60; return `<g transform="translate(${f(x)} ${f(y)}) scale(${f(k)})" filter="url(#sh)"><rect x="${-w/2}" y="${-size*.85}" width="${w}" height="${size*1.4}" rx="${size*.35}" fill="${bg}"/><text text-anchor="middle" y="${size*.12}" font-size="${size}" fill="${fg}">${txt}</text></g>`; }
function captions(t){ // word-by-word, two words highlighted, safe zone y=1330
  let line=null; for(const l of TL.lines) if(t>=l.start-.05&&t<=l.start+l.dur+.25) line=l; if(!line) return '';
  const ws=line.words; let i=ws.findIndex(w=>t<w.e); if(i<0) i=ws.length-1; const a=Math.max(0,i-(i%3)), chunk=ws.slice(a,a+3);
  const txt=chunk.map((w,j)=>`<tspan fill="${a+j===i?'#FFD21F':'#fff'}">${w.w.toUpperCase()}</tspan>`).join(' ');
  return `<text x="540" y="1350" text-anchor="middle" font-size="84" stroke="#2a1608" stroke-width="18" stroke-linejoin="round" paint-order="stroke">${txt}</text>`;
}
function frame(t){
  const L=TL.lines.map(l=>l.start), green=t>=L[4]-.2;
  let g=`<rect width="1080" height="1920" fill="url(#${green?'skyG':'sky'})"/>`;
  // floor
  g+=`<rect y="1080" width="1080" height="840" fill="${green?'#7CCB98':'#E7B489'}"/>`;
  const push=1+.04*Math.sin(t*.35);
  let w='';
  if(t<L[2]-.1){ // the jar, the year counter
    const k=pop(t,.15), yr=Math.round(lerp(1996,2026,eout(seg(t,L[1]-.3,L[1]+1.6))));
    w+=`<g transform="translate(540 1150) scale(${f(1.95*clamp(k))})">${jar({x:0,y:0,s:1,bills:10})}</g>`;
    w+=label(540,280,`${yr}`,90,'#fff','#2b1a0e',clamp(pop(t,.4)));
    w+=big(540,470,'$1,000',150,'#16A673',clamp(pop(t,.6)));
    if(t>L[1]+.3) w+=label(540,610,'EVERY BILL STILL THERE ✓',46,'#fff','#16A673',clamp(pop(t,L[1]+.3)));
  } else if(t<L[3]-.1){ // the cart empties
    const k=eio(seg(t,L[2]+.8,L[2]+2.6)), fill=lerp(1,.47,k);
    w+=`<g transform="translate(540 1060) scale(2.4)">${cart({x:0,y:0,s:1,fill})}</g>`;
    w+=label(540,280,k<.5?'1996 PRICES':'TODAY\'S PRICES',64,'#fff',k<.5?'#2b1a0e':'#E0392B',1);
    w+=big(540,500,`$${Math.round(lerp(1000,470,k))}`,170,k<.5?'#16A673':'#E0392B',clamp(pop(t,L[2]+.1)));
    w+=`<text x="540" y="590" text-anchor="middle" font-size="44" fill="#5a2f12" opacity="${f(clamp(k*2))}">worth of groceries</text>`;
  } else if(t<L[4]-.2){ // the mouse
    w+=`<g transform="translate(540 1150) scale(1.95)">${jar({x:0,y:0,s:1,bills:Math.max(4,Math.round(10-6*seg(t,L[3],L[3]+3)))})}</g>`;
    w+=`<g transform="translate(560 1090) scale(${f(2.3*clamp(pop(t,L[3]+.2)))})">${mouse({x:0,y:0,s:1,t,nibble:1,tag:true})}</g>`;
    w+=label(540,300,'INFLATION',90,'#fff','#E0392B',clamp(pop(t,L[3]+.5)));
    w+=big(540,500,'−53%',150,'#E0392B',clamp(pop(t,L[3]+1.4)));
  } else if(t<L[6]-.2){ // the planted thousand
    const gr=eout(seg(t,L[4]+.3,L[5]+.3));
    w+=`<g transform="translate(540 1170) scale(${f(1.05)})">${tree({x:0,y:0,size:lerp(.15,1,gr),leaves:1,coins:Math.round(30*gr),t})}</g>`;
    w+=label(540,280,'SAME $1,000 · STOCK MARKET',52,'#fff','#16A673',clamp(pop(t,L[4]+.2)));
    if(t>L[5]-.1){ const v=Math.round(lerp(1000,16368,eout(seg(t,L[5],L[5]+1.4))));
      w+=`<circle cx="540" cy="480" r="${f(260*clamp(pop(t,L[5])))}" fill="#FFE58A" opacity=".55" filter="url(#soft)"/>`;
      w+=big(540,540,'$'+v.toLocaleString('en-US'),165,'#16A673',clamp(pop(t,L[5])));}
  } else { // end card
    const k=clamp(pop(t,L[6]));
    w+=`<g transform="translate(300 1150) scale(${f(1.45*k)})">${jar({x:0,y:0,s:1,bills:4})}</g>`;
    w+=`<g transform="translate(770 1150) scale(${f(.62*k)})">${tree({x:0,y:0,size:1,leaves:1,coins:30,t})}</g>`;
    w+=label(540,300,'WHICH ONE ARE YOU?',74,'#fff','#2b1a0e',k);
    w+=`<text x="540" y="470" text-anchor="middle" font-size="50" fill="#5a2f12" opacity="${f(k)}">Full story on Coin Theory</text>`;
  }
  g+=`<g transform="translate(540 960) scale(${f(push)}) translate(-540 -960)">${w}</g>`;
  // Penny narrates from the corner (talks with the voice)
  const fr=Math.min(TL.mouth?TL.mouth.length-1:0,Math.round(t*30)); const mo=TL.mouth?TL.mouth[fr]:.3*Math.abs(Math.sin(t*9));
  g+=`<g filter="url(#sh)">${penny({x:200,y:1680,r:115,t,mood:t>L[3]&&t<L[4]?'worried':'happy',mouth:mo,blink:(t%3.6)<.12,armL:200,armR:-20})}</g>`;
  g+=captions(t);
  document.getElementById('root').innerHTML=g;
}
window.setup=tl=>{TL=tl;}; window.frame=frame;
</script></body></html>
