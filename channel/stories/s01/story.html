<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:P;src:url(file:///root/.fonts/Poppins-900.ttf);font-weight:900}
@font-face{font-family:P;src:url(file:///root/.fonts/Poppins-700.ttf);font-weight:700}
@font-face{font-family:A;src:url(file:///root/.fonts/Anton-400.ttf)}
html,body{margin:0;background:#000;overflow:hidden}
svg{display:block}
text{font-family:P;font-weight:900}
.cap{paint-order:stroke;stroke:#1a0f06;stroke-width:13px;stroke-linejoin:round}
</style></head><body>
<svg id="s" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="coin" cx=".36" cy=".3" r=".8"><stop offset="0" stop-color="#FFF4B8"/><stop offset=".35" stop-color="#FFD54A"/><stop offset=".8" stop-color="#F2A81D"/><stop offset="1" stop-color="#D98C0C"/></radialGradient>
  <linearGradient id="bag" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A86B3A"/><stop offset=".5" stop-color="#C98B52"/><stop offset="1" stop-color="#94592D"/></linearGradient>
  <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#3a1a05" flood-opacity=".3"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  <linearGradient id="capfade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".45"/></linearGradient>
</defs>
<g id="root"></g>
</svg>
<script src="../../motion/kit.js"></script>
<script>const f=n=>(+n).toFixed(1);</script>
<script src="../../motion/penny.js"></script>
<script src="../../motion/cast.js"></script>
<script>
const W=1920,H=1080,GY=830;
const {clamp,seg,lerp,spring,springBounce,countUp,shockwave,rand,squash}=MK;
const eo=x=>1-Math.pow(1-clamp(x),3), eio=x=>{x=clamp(x);return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2};
const back=x=>{x=clamp(x);const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const pop=(t,s,d=.45)=>t<s?0:back(seg(t,s,s+d));
let TL=null, DCA=null, SC={};
const money=v=>'$'+Math.round(v).toLocaleString('en-US');

// ---------------------------------------------------------------- helpers ---
function scene(t){ let cur=TL.scenes[0]; for(const s of TL.scenes) if(t>=s.start) cur=s; return cur; }
function talkOf(t,who){ // mouth openness for a character if it's their line
  const fr=Math.min(TL.mouth.length-1,Math.round(t*TL.fps));
  for(const s of TL.scenes) for(const l of s.lines) if(l.who===who && t>=l.start && t<=l.start+l.dur){
    let m=0,n=0; for(let i=-2;i<=2;i++){ const j=Math.min(TL.mouth.length-1,Math.max(0,fr+i)); m+=TL.mouth[j]; n++; }
    return Math.max(.05, m/n); } // smoothed mouth; never 0 inside the line, so gestures don't flicker
  return 0;
}
const blinkAt=(t,ph=0)=>((t+ph)%3.7)<.12;
function sky(t,stormK=0,night=0){
  const top=mixc('#9ED8FF','#4A5568',stormK), bot=mixc('#FFF1DC','#A0AEC0',stormK);
  let g=`<defs><linearGradient id="skyg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${top}"/><stop offset="1" stop-color="${bot}"/></linearGradient></defs><rect width="${W}" height="${H}" fill="url(#skyg)"/>`;
  if(stormK<.6) g+=`<circle cx="1640" cy="170" r="90" fill="#FFE58A" opacity="${f(1-stormK*1.6)}"/><circle cx="1640" cy="170" r="140" fill="#FFE58A" opacity="${f(.25*(1-stormK*1.6))}"/>`;
  for(let i=0;i<4;i++){const cx=((i*520+t*14)%(W+400))-200, cy=120+i*45; g+=`<g opacity="${f(.85*(1-stormK))}"><ellipse cx="${f(cx)}" cy="${cy}" rx="110" ry="38" fill="#fff"/><ellipse cx="${f(cx+60)}" cy="${cy-20}" rx="70" ry="34" fill="#fff"/></g>`;}
  return g;
}
function mixc(a,b,k){k=clamp(k);const p=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16));const A=p(a),B=p(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*k).toString(16).padStart(2,'0')).join('');}
function ground(stormK=0){
  return `<rect y="${GY}" width="${W}" height="${H-GY}" fill="${mixc('#7CC46A','#5E7F57',stormK)}"/><rect y="${GY}" width="${W}" height="14" fill="${mixc('#5DA84B','#4A6A44',stormK)}"/>`+
    Array.from({length:14},(_,i)=>`<path d="M${i*140+30} ${GY+60+(i%3)*40} q8 -22 16 0 q8 -18 16 0" stroke="#4E9A3E" stroke-width="5" fill="none"/>`).join('');
}
function house(x,y,s=1){
  return `<g transform="translate(${x} ${y}) scale(${s})" filter="url(#sh)"><rect x="-200" y="-300" width="400" height="300" fill="#F9E3C3" stroke="${INK}" stroke-width="6"/><path d="M-240 -290 L0 -470 L240 -290Z" fill="#C2410C" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/>`+
    `<rect x="-50" y="-170" width="100" height="170" rx="8" fill="#7C2D12" stroke="${INK}" stroke-width="6"/><circle cx="30" cy="-85" r="8" fill="#FDE047"/>`+
    `<rect x="-160" y="-240" width="90" height="80" fill="#BFE7FF" stroke="${INK}" stroke-width="6"/><rect x="70" y="-240" width="90" height="80" fill="#BFE7FF" stroke="${INK}" stroke-width="6"/></g>`;
}
function fence(){ let g=''; for(let x=0;x<W;x+=70) g+=`<rect x="${x+10}" y="${GY-110}" width="44" height="118" rx="6" fill="#FFF7ED" stroke="${INK}" stroke-width="4"/>`; return `<g opacity=".9">${g}<rect x="0" y="${GY-80}" width="${W}" height="16" fill="#FFF7ED" stroke="${INK}" stroke-width="4"/></g>`; }
// big year badge (springs in when the year changes)
function yearBadge(t,year,since){
  const k=pop(t,since,.5);
  return `<g transform="translate(160 120) scale(${f(k)}) rotate(-4)" filter="url(#sh)"><rect x="-130" y="-62" width="260" height="124" rx="22" fill="#1E293B" stroke="#FDE047" stroke-width="8"/><text x="0" y="32" text-anchor="middle" font-size="86" fill="#FDE047" font-family="A" style="font-family:A">${year}</text></g>`;
}
function hud(t,label,val,k=1,col='#16A34A'){
  if(k<=0) return '';
  return `<g transform="translate(1600 110) scale(${f(k)})" filter="url(#sh)"><rect x="-260" y="-70" width="520" height="140" rx="26" fill="#fff" stroke="${INK}" stroke-width="6"/>`+
    `<text x="0" y="-18" text-anchor="middle" font-size="34" fill="#475569" style="font-weight:700">${label}</text><text x="0" y="48" text-anchor="middle" font-size="68" fill="${col}">${val}</text></g>`;
}
function bigNum(x,y,text,size,col,k,rot=0){
  if(k<=0) return '';
  return `<g transform="translate(${f(x)} ${f(y)}) rotate(${rot}) scale(${f(k)})"><text text-anchor="middle" font-size="${size}" fill="${col}" class="cap" style="stroke-width:${size*.15}px">${text}</text></g>`;
}
function card(x,y,w,h,k){ return `<rect x="${f(x-w/2)}" y="${f(y-h/2)}" width="${w}" height="${h}" rx="30" fill="#fff" stroke="${INK}" stroke-width="6" filter="url(#sh)" transform="translate(${f(x*(1-k))} ${f(y*(1-k))}) scale(${f(k)})" />`; }
function label(x,y,text,size,col='#fff',bg='#1E293B',k=1,rot=0){
  if(k<=0) return ''; MC0.font=`900 ${size}px P`; const w=MC0.measureText(text).width+size*.9;
  return `<g transform="translate(${f(x)} ${f(y)}) rotate(${rot}) scale(${f(k)})" filter="url(#sh)"><rect x="${f(-w/2)}" y="${f(-size*.85)}" width="${f(w)}" height="${f(size*1.5)}" rx="${f(size*.4)}" fill="${bg}"/><text x="0" y="${f(size*.32)}" text-anchor="middle" font-size="${size}" fill="${col}">${text}</text></g>`;
}
function confetti(t,t0,n=60){ const k=t-t0; if(k<0||k>3.2) return ''; let g='';
  for(let i=0;i<n;i++){const x=W/2+(rand(i,1)-.5)*1600*Math.min(1,k*2), y=-40+k*380*(.6+rand(i,2))+Math.sin(k*5+i)*20, c=['#F43F5E','#FDE047','#22C55E','#3B82F6','#F97316'][i%5];
    g+=`<rect x="${f(x)}" y="${f(y)}" width="18" height="10" fill="${c}" transform="rotate(${f(k*300+i*40)} ${f(x)} ${f(y)})"/>`;} return g; }
function leavesFalling(t,t0,dur,x0,y0,n=24){ const k=t-t0; if(k<0||k>dur) return ''; let g='';
  for(let i=0;i<n;i++){const st=rand(i,7)*dur*.6, kk=k-st; if(kk<0) continue; const x=x0+(rand(i,3)-.3)*500+kk*260, y=y0+(rand(i,4)-.5)*200+kk*kk*120+kk*60;
    if(y>GY+40) continue; g+=`<ellipse cx="${f(x)}" cy="${f(y)}" rx="18" ry="10" fill="${i%3?'#2E9E4F':'#FFD23F'}" stroke="${INK}" stroke-width="3" transform="rotate(${f(kk*400+i*30)} ${f(x)} ${f(y)})"/>`;} return g; }
function captions(t){
  let line=null; for(const s of TL.scenes) for(const l of s.lines) if(t>=l.start-.05 && t<=l.start+l.dur+.25) line=l;
  if(!line||!line.words.length) return '';
  const ws=line.words; let i=0; for(let k=0;k<ws.length;k++) if(t>=ws[k].s-.05) i=k;
  const c0=Math.floor(i/6)*6, chunk=ws.slice(c0,c0+6), size=54; MC0.font=`900 ${size}px P`;
  const wd=chunk.map(w=>MC0.measureText(w.w.toUpperCase()).width+size*.36), tot=wd.reduce((a,b)=>a+b,0);
  let x=W/2-tot/2, g=`<rect y="880" width="${W}" height="200" fill="url(#capfade)"/>`;
  chunk.forEach((w,k)=>{ const cx=x+wd[k]/2; x+=wd[k]; if(t<w.s-.05) return; const on=c0+k===i;
    g+=`<text x="${f(cx)}" y="1030" text-anchor="middle" font-size="${size}" fill="${on?'#FFD21F':'#fff'}" class="cap">${w.w.toUpperCase()}</text>`; });
  return g;
}
// tree value keyframes [time, value]; built once from the timeline
let TREEK=[];
function treeVal(t){ let v=TREEK[0][1]; for(let i=1;i<TREEK.length;i++){ const [t0,v0]=TREEK[i-1],[t1,v1]=TREEK[i]; if(t>=t1) v=v1; else if(t>t0){ v=v0+(v1-v0)*eio((t-t0)/(t1-t0)); break; } } return v; }

// -------------------------------------------------------------- scenes ---
const SCN={};
SCN.open=(t,s,L,lt)=>{ // 2026 doorstep
  let g=sky(t)+ground()+fence()+house(520,GY,1.15);
  const walk=k=>eo(seg(t,s.start+.2,s.start+2.6));
  const xs=[1000,1250,1500].map(x=>lerp(x+700,x,walk()));
  const moving=t<s.start+2.6;
  g+=CAST.grandpa({x:520,y:GY,t,mood:'happy',talk:talkOf(t,'G'),blink:blinkAt(t),armL:110,armR:-20,look:[1,0]});
  g+=parrot({x:650,y:GY-440,s:.7,t,squawk:0});
  g+=CAST.mia({adult:true,x:xs[0],y:GY,t,walk:moving,mood:t>L[4]?'sad':'happy',blink:blinkAt(t,1),armL:60,armR:120,look:[-1,0],holdR:''})+gadgets({x:xs[0]+10,y:GY-110,s:.55,t,beep:t>L[4]&&t<L[5]});
  g+=CAST.ben({adult:true,x:xs[1],y:GY,t,walk:moving,mood:t>L[3]&&t<L[5]?'worried':'happy',blink:blinkAt(t,2),armL:60,armR:120,look:[-1,0]})+jar({x:xs[1],y:GY-150,s:.38,bills:8});
  g+=CAST.rosie({adult:true,x:xs[2],y:GY,t,walk:moving,mood:'happy',blink:blinkAt(t,.5),armL:60,armR:120,look:[-1,0]})+
    `<g transform="translate(${f(xs[2])} ${GY-250}) rotate(4)" filter="url(#sh)"><rect x="-70" y="-60" width="140" height="120" rx="8" fill="#fff" stroke="${INK}" stroke-width="5"/>${tree({x:0,y:45,size:.08,leaves:1,t}).replace('translate(0 45)','translate(0 45) scale(.5)')}</g>`;
  g+=bigNum(xs[2],170,money(TL.N.now),62,'#16A34A',pop(t,L[2],.5)*(t<L[3]?1:0));
  g+=bigNum(xs[1],170,'$1,000 = $470?',50,'#F97316',pop(t,L[3],.5)*(t<L[4]?1:0));
  g+=bigNum(xs[0],170,'$0 + JUNK',56,'#E11D48',pop(t,L[4],.5)*(t<L[5]?1:0));
  if(t>=L[5]&&t<L[6]) [0,1,2].forEach(i=>g+=bigNum(xs[i],160,'?',130,'#FDE047',pop(t,L[5]+i*.2,.5)));
  if(t>=L[6]){ const k=pop(t,L[6],.5); g+=`<rect width="${W}" height="${H}" fill="#FFF1DC" opacity="${f(.85*Math.min(1,k))}"/>`;
    g+=penny({x:960,y:780,r:190,t,mouth:TL.mouth[Math.round(t*30)]||0,blink:blinkAt(t),armL:150,armR:-40,sx:k,sy:k});
    g+=label(960,230,"KIDS: MADE UP",50,'#fff','#334155',pop(t,L[6]+1.6)); g+=label(960,330,'NUMBERS: 100% REAL',58,'#14532D','#86EFAC',pop(t,L[6]+2.6));
    if(t>=L[7]){ const yr=Math.round(2026-30*eio(seg(t,L[7]+.3,L[7]+2.0))); g+=`<rect width="${W}" height="${H}" fill="#1E293B" opacity="${f(.9*seg(t,L[7],L[7]+.3))}"/>`+bigNum(960,600,yr,260,'#FDE047',1); }
  }
  return g;
};
SCN.y1996=(t,s,L)=>{
  let g=sky(t)+ground()+fence()+house(300,GY,1.0);
  const gt=talkOf(t,'G');
  g+=yearBadge(t,1996,s.start);
  g+=CAST.grandpa({x:700,y:GY,t,mood:'happy',talk:gt,blink:blinkAt(t),armL:110,armR:t>L[3]&&t<L[4]+1?-30:60,look:[1,0]});
  const sq=talkOf(t,'N'); g+=parrot({x:830,y:GY-440,s:.7,t,squawk:sq>0?Math.min(1,sq*1.5):0});
  const kids=[['mia',1060,'MIA, 12'],['rosie',1300,'ROSIE, 11'],['ben',1530,'BEN, 10']];
  kids.forEach(([k,x,nm],i)=>{ const env=t>L[3]+i*.35; g+=CAST[k]({x,y:GY,t,mood:'happy',blink:blinkAt(t,i),armL:110,armR:env?-40:70,look:[-1,0],holdR:env?envelope({x:0,y:-20,s:.45,open:t>L[4]?1:0}):''});
    g+=label(x,GY+60,nm,40,'#fff',['#EC4899','#F59E0B','#22C55E'][i],pop(t,L[4]+i*.3)); });
  if(t>L[3]&&t<L[3]+1.4) kids.forEach(([k,x],i)=>{ const p=seg(t,L[3]+i*.25,L[3]+i*.25+.7); if(p>0&&p<1){ const [ex,ey]=MK.bez([760,GY-300],[800,GY-600],[x-50,GY-600],[x+60,GY-240],eo(p)); g+=envelope({x:ex,y:ey,s:.5,rot:p*360}); } });
  if(t>=L[1]&&t<L[2]+.5) g+=bubble({x:520,y:GY-760,text:'...a little more CENTS!',size:44,k:pop(t,L[1]+1.6),tail:'right'});
  if(t>=L[2]&&t<L[3]) g+=label(980,GY-700,'JOKE #400',46,'#fff','#E11D48',pop(t,L[2]+.8),-6);
  if(t>=L[6]&&t<L[7]) g+=bubble({x:1000,y:GY-800,text:'BORING!',size:60,k:pop(t,L[6]),tail:'left',color:'#FDE047'});
  if(t>=L[7]){ const k=pop(t,L[7],.5); g+=`<rect width="${W}" height="${H}" fill="#000" opacity="${f(.55*Math.min(1,k))}"/>`;
    g+=`<g transform="translate(960 520) scale(${f(k)})" filter="url(#sh)"><rect x="-330" y="-200" width="660" height="400" rx="20" fill="#92400E" stroke="${INK}" stroke-width="8"/><rect x="-280" y="-150" width="560" height="140" rx="10" fill="#B45309" stroke="${INK}" stroke-width="5"/>`+
      `<rect x="-40" y="-110" width="80" height="22" rx="10" fill="#FDE047"/><circle cx="0" cy="60" r="44" fill="#FDE047" stroke="${INK}" stroke-width="6"/><rect x="-10" y="52" width="20" height="40" fill="${INK}"/></g>`;
    g+=envelope({x:960,y:lerp(200,380,eo(seg(t,L[7]+.4,L[7]+1.4))),s:.9,rot:-6,label:'?'})+label(960,840,'SECRET NOTE: OPEN IN 2026',48,'#1E293B','#FDE047',pop(t,L[7]+1.2)); }
  return g;
};
SCN.choices=(t,s,L)=>{
  let g=sky(t)+ground()+fence();
  // three zones; spotlight follows the line
  const focus=t<L[1]?0:t<L[3]?1:2;
  const xs=[400,960,1500];
  // Mia
  const mk=t<L[1]?1:.45;
  g+=`<g opacity="${f(focus===0?1:.55)}">`+CAST.mia({x:xs[0],y:GY,t,mood:'laugh',blink:blinkAt(t),armL:200,armR:-30,talk:talkOf(t,'M')})+'</g>';
  if(t>=L[0]){ const items=[['VIRTUAL PET','#F472B6'],['LIGHT-UP SNEAKERS','#22D3EE'],['CANDY!','#F97316']];
    items.forEach(([nm,c],i)=>{ const k=pop(t,L[0]+1.2+i*1.1); if(t<L[1]+.5) g+=label(xs[0]+(i-1)*40,GY-670-i*90,nm,36,'#fff',c,k,(i-1)*5); });
    for(let i=0;i<8;i++){ const p=seg(t,L[0]+.5+i*.25,L[0]+2+i*.25); if(p>0&&p<1) g+=`<g transform="translate(${f(xs[0]+60+p*500)} ${f(GY-300-Math.sin(p*3)*200)}) rotate(${f(p*200)})"><rect x="-40" y="-18" width="80" height="36" rx="5" fill="#86C98B" stroke="#2F6B3A" stroke-width="3"/></g>`; }
  }
  if(t>=L[6]&&t<L[7]) g+=bubble({x:xs[0]+120,y:GY-700,text:"A STICK?",size:56,k:pop(t,L[6])});
  // Ben
  if(t>=L[1]-.3){ g+=`<g opacity="${f(focus===1?1:.55)}">`+jar({x:xs[1]+120,y:GY,s:.75*pop(t,L[1]),bills:t>L[1]+1?10:Math.floor(10*seg(t,L[1],L[1]+1))})+
    CAST.ben({x:xs[1]-130,y:GY,t,mood:'happy',talk:talkOf(t,'B'),blink:blinkAt(t,1),armL:110,armR:-10,look:[1,0]})+'</g>';
    if(t>=L[2]&&t<L[3]) g+=bubble({x:xs[1]-60,y:GY-680,text:'NEVER LOSE A DOLLAR!',size:40,k:pop(t,L[2]+.4)}); }
  // Rosie
  if(t>=L[3]-.3){ g+=`<g opacity="${f(focus===2?1:.55)}">`+CAST.rosie({x:xs[2]-120,y:GY,t,mood:'happy',talk:talkOf(t,'R'),blink:blinkAt(t,2),armL:110,armR:t>L[5]?40:-20,look:[1,0]})+'</g>';
    if(t>=L[3]&&t<L[5]){ // 500 companies grid
      const k=pop(t,L[3]+1.5,.6); let gg=`<g transform="translate(${xs[2]+170} ${GY-420}) scale(${f(k)})" filter="url(#sh)"><rect x="-200" y="-150" width="400" height="300" rx="20" fill="#fff" stroke="${INK}" stroke-width="5"/>`;
      for(let i=0;i<50;i++){ const cx=-170+(i%10)*37, cy=-115+Math.floor(i/10)*48, on=seg(t,L[3]+1.8+i*.04,L[3]+1.9+i*.04); gg+=`<rect x="${cx}" y="${cy}" width="26" height="${30+(i*7)%14}" rx="3" fill="${['#60A5FA','#F472B6','#FBBF24','#34D399'][i%4]}" opacity="${f(on)}" stroke="${INK}" stroke-width="2"/>`; }
      gg+=`<text x="0" y="138" text-anchor="middle" font-size="30" fill="${INK}">500 BIG COMPANIES</text></g>`; g+=gg;
      if(t>=L[4]) for(let i=0;i<6;i++){ const p=((t-L[4])*.6+i/6)%1; const [cx,cy]=MK.bez([xs[2]+170,GY-420],[xs[2]+60,GY-650],[xs[2]-120,GY-600],[xs[2]-120,GY-350],p); g+=`<circle cx="${f(cx)}" cy="${f(cy)}" r="18" fill="#FFD23F" stroke="${INK}" stroke-width="4"/>`; }
    }
    if(t>=L[5]){ g+=tree({x:xs[2]+120,y:GY,size:.05*pop(t,L[5]+.6),leaves:1,t}); g+=label(xs[2]+120,GY+70,'MONEY TREE',38,'#fff','#16A34A',pop(t,L[5]+1.2)); }
    if(t>=L[7]) g+=bubble({x:xs[2]-60,y:GY-680,text:'TREES TAKE TIME.',size:42,k:pop(t,L[7]),tail:'left'});
  }
  return g;
};
function treeScene(t,s,L,opts){ // shared yard with Rosie's tree, HUD and storm
  const {size,leaves,stormK=0,bolt=false,shake=0,year,ysince,cloudLabel=''}=opts;
  let g=sky(t,stormK)+ground(stormK)+fence();
  if(stormK>0) g+=storm({x:1100,y:150,w:1300,k:stormK,t,bolt})+(cloudLabel?label(1100,120,cloudLabel,44,'#fff','#E11D48',Math.min(1,stormK*1.4)):'');
  g+=tree({x:1100,y:GY,size,leaves,shake,coins:Math.round(6*leaves*size),t});
  g+=yearBadge(t,year,ysince);
  g+=hud(t,"ROSIE'S TREE",money(treeVal(t)),1,treeVal(t)>=1000?'#16A34A':'#DC2626');
  return g;
}
SCN.storm1=(t,s,L)=>{

    if(t>=L[8]){ g+=CAST.mia({adult:true,x:700,y:GY,t,mood:'happy',blink:blinkAt(t),armL:110,armR:t<L[8]+2?100:70})+tree({x:860,y:GY,size:.02*eo(seg(t,L[8]+1.5,L[8]+2.5)),leaves:1,t}); }
    if(t>=L[9]&&t<L[10]){ g+=parrot({x:1430,y:GY-440,s:.7,t,squawk:talkOf(t,'N')?1:0})+bubble({x:1280,y:GY-640,text:"DON'T CHOP THE TREE!",size:44,k:pop(t,L[9]),color:'#FDE047',tail:'right'}); }
    if(t>=L[10]){ const k=pop(t,L[10]); g+=`<rect width="${W}" height="${H}" fill="#000" opacity="${f(.5*Math.min(1,k))}"/>`+
      `<g transform="translate(960 470) rotate(-2) scale(${f(k)})" filter="url(#sh)"><rect x="-560" y="-220" width="1120" height="440" rx="16" fill="#FEF9C3" stroke="${INK}" stroke-width="6"/><text x="0" y="-120" text-anchor="middle" font-size="40" fill="#92400E" style="font-weight:700">GRANDPA'S SECRET NOTE · 1996</text>`+
      `<text x="0" y="0" text-anchor="middle" font-size="56" fill="${INK}">I'm proud of all three of you.</text><text x="0" y="100" text-anchor="middle" font-size="56" fill="#16A34A">Now go plant something.</text></g>`; }
  }
  return g;
};

};

function frame(t){
  const s=scene(t), L=s.lines.map(l=>l.start);
  let g=(SCN[s.id]||(()=>''))(t,s,L);
  // scene transition: quick iris/wipe in the first 0.35 s
  const k=seg(t,s.start,s.start+.4); if(k<1&&s.start>0) g+=`<rect width="${W}" height="${H}" fill="#1E293B" opacity="${f(1-k)}"/>`;
  g+=captions(t);
  document.getElementById('root').innerHTML=g;
}
