const lerp=(a,b,k)=>a+(b-a)*k;
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eout=x=>1-Math.pow(1-x,3);
const spring=(t,t0,k=1)=>{const x=t-t0;if(x<=0)return 0;return 1-Math.exp(-6*x*k)*Math.cos(9*x*k);};

  el(`<svg class="abs" style="left:${cx}px;top:${clamp(cy,y+40,y+vh)}px;transition:none" width="40" height="50"><path d="M4 4 L4 38 L14 29 L21 45 L28 42 L21 26 L34 26Z" fill="#fff" stroke="#111" stroke-width="3" stroke-linejoin="round"/></svg>`);

// ------------------------------------------------------------------ frame
function scene(t){ let cur=TL.scenes[0]; for(const s of TL.scenes) if(t>=s.start) cur=s; return cur; }
function frame(t){
  const s=scene(t), lt=t-s.start, L=s.lines.map(l=>l.start-s.start); HTML='';
  document.getElementById('glow').style.transform=`scale(${1+.05*Math.sin(t*.6)})`;
  (SCN[s.id]||(()=>{}))(lt,s,L);
  // soft dip at every scene change
  const k=seg(lt,0,.35); if(k<1&&s.start>0) HTML+=`<div class="abs" style="left:0;top:0;width:1920px;height:1080px;background:#0B1628;opacity:${(1-k)*.9}"></div>`;
  const nx=TL.scenes[TL.scenes.indexOf(s)+1]; if(nx){const e=seg(t,nx.start-.25,nx.start); if(e>0) HTML+=`<div class="abs" style="left:0;top:0;width:1920px;height:1080px;background:#0B1628;opacity:${e*.9}"></div>`;}
  st.innerHTML=HTML;
}
window.setup=(tl,dca,N)=>{ TL=tl; };
window.frame=frame;
