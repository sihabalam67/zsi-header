<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:P;src:url(file:///root/.fonts/Poppins-900.ttf);font-weight:900}
@font-face{font-family:P;src:url(file:///root/.fonts/Poppins-700.ttf);font-weight:700}
@font-face{font-family:A;src:url(file:///root/.fonts/Anton-400.ttf)}
html,body{margin:0;background:#000;overflow:hidden}
svg{display:block}
text{font-family:P;font-weight:900}
.cap{paint-order:stroke;stroke:#1a0f06;stroke-width:13px;stroke-linejoin:round}
</style></head><body>
<svg id="s" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="coin" cx=".36" cy=".3" r=".8"><stop offset="0" stop-color="#FFF4B8"/><stop offset=".35" stop-color="#FFD54A"/><stop offset=".8" stop-color="#F2A81D"/><stop offset="1" stop-color="#D98C0C"/></radialGradient>
  <linearGradient id="bag" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A86B3A"/><stop offset=".5" stop-color="#C98B52"/><stop offset="1" stop-color="#94592D"/></linearGradient>
  <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#3a1a05" flood-opacity=".3"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  <linearGradient id="capfade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".45"/></linearGradient>
</defs>
<g id="root"></g>
</svg>
<script src="../../motion/kit.js"></script>
<script>const f=n=>(+n).toFixed(1);</script>
<script src="../../motion/penny.js"></script>
<script src="../../motion/cast.js"></script>
<script>
const W=1920,H=1080,GY=830;
const {clamp,seg,lerp,spring,springBounce,countUp,shockwave,rand,squash}=MK;
const eo=x=>1-Math.pow(1-clamp(x),3), eio=x=>{x=clamp(x);return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2};
const back=x=>{x=clamp(x);const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const pop=(t,s,d=.45)=>t<s?0:back(seg(t,s,s+d));
let TL=null, DCA=null, SC={};
const money=v=>'$'+Math.round(v).toLocaleString('en-US');

// ---------------------------------------------------------------- helpers ---
function scene(t){ let cur=TL.scenes[0]; for(const s of TL.scenes) if(t>=s.start) cur=s; return cur; }
function talkOf(t,who){ // mouth openness for a character if it's their line
  const fr=Math.min(TL.mouth.length-1,Math.round(t*TL.fps));
  for(const s of TL.scenes) for(const l of s.lines) if(l.who===who && t>=l.start && t<=l.start+l.dur){
    let m=0,n=0; for(let i=-2;i<=2;i++){ const j=Math.min(TL.mouth.length-1,Math.max(0,fr+i)); m+=TL.mouth[j]; n++; }
    return Math.max(.05, m/n); } // smoothed mouth; never 0 inside the line, so gestures don't flicker
  return 0;
}
const blinkAt=(t,ph=0)=>((t+ph)%3.7)<.12;
function sky(t,stormK=0,night=0){
  const top=mixc('#9ED8FF','#4A5568',stormK), bot=mixc('#FFF1DC','#A0AEC0',stormK);
  let g=`<defs><linearGradient id="skyg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${top}"/><stop offset="1" stop-color="${bot}"/></linearGradient></defs><rect width="${W}" height="${H}" fill="url(#skyg)"/>`;
  if(stormK<.6) g+=`<circle cx="1640" cy="170" r="90" fill="#FFE58A" opacity="${f(1-stormK*1.6)}"/><circle cx="1640" cy="170" r="140" fill="#FFE58A" opacity="${f(.25*(1-stormK*1.6))}"/>`;
  for(let i=0;i<4;i++){const cx=((i*520+t*14)%(W+400))-200, cy=120+i*45; g+=`<g opacity="${f(.85*(1-stormK))}"><ellipse cx="${f(cx)}" cy="${cy}" rx="110" ry="38" fill="#fff"/><ellipse cx="${f(cx+60)}" cy="${cy-20}" rx="70" ry="34" fill="#fff"/></g>`;}
  return g;
}
function mixc(a,b,k){k=clamp(k);const p=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16));const A=p(a),B=p(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*k).toString(16).padStart(2,'0')).join('');}
function ground(stormK=0){
  return `<rect y="${GY}" width="${W}" height="${H-GY}" fill="${mixc('#7CC46A','#5E7F57',stormK)}"/><rect y="${GY}" width="${W}" height="14" fill="${mixc('#5DA84B','#4A6A44',stormK)}"/>`+
    Array.from({length:14},(_,i)=>`<path d="M${i*140+30} ${GY+60+(i%3)*40} q8 -22 16 0 q8 -18 16 0" stroke="#4E9A3E" stroke-width="5" fill="none"/>`).join('');
}
function house(x,y,s=1){
  return `<g transform="translate(${x} ${y}) scale(${s})" filter="url(#sh)"><rect x="-200" y="-300" width="400" height="300" fill="#F9E3C3" stroke="${INK}" stroke-width="6"/><path d="M-240 -290 L0 -470 L240 -290Z" fill="#C2410C" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/>`+
    `<rect x="-50" y="-170" width="100" height="170" rx="8" fill="#7C2D12" stroke="${INK}" stroke-width="6"/><circle cx="30" cy="-85" r="8" fill="#FDE047"/>`+
    `<rect x="-160" y="-240" width="90" height="80" fill="#BFE7FF" stroke="${INK}" stroke-width="6"/><rect x="70" y="-240" width="90" height="80" fill="#BFE7FF" stroke="${INK}" stroke-width="6"/></g>`;
}
function fence(){ let g=''; for(let x=0;x<W;x+=70) g+=`<rect x="${x+10}" y="${GY-110}" width="44" height="118" rx="6" fill="#FFF7ED" stroke="${INK}" stroke-width="4"/>`; return `<g opacity=".9">${g}<rect x="0" y="${GY-80}" width="${W}" height="16" fill="#FFF7ED" stroke="${INK}" stroke-width="4"/></g>`; }
// big year badge (springs in when the year changes)
function yearBadge(t,year,since){
  const k=pop(t,since,.5);
  return `<g transform="translate(160 120) scale(${f(k)}) rotate(-4)" filter="url(#sh)"><rect x="-130" y="-62" width="260" height="124" rx="22" fill="#1E293B" stroke="#FDE047" stroke-width="8"/><text x="0" y="32" text-anchor="middle" font-size="86" fill="#FDE047" font-family="A" style="font-family:A">${year}</text></g>`;
}
function hud(t,label,val,k=1,col='#16A34A'){
  if(k<=0) return '';
  return `<g transform="translate(1600 110) scale(${f(k)})" filter="url(#sh)"><rect x="-260" y="-70" width="520" height="140" rx="26" fill="#fff" stroke="${INK}" stroke-width="6"/>`+
    `<text x="0" y="-18" text-anchor="middle" font-size="34" fill="#475569" style="font-weight:700">${label}</text><text x="0" y="48" text-anchor="middle" font-size="68" fill="${col}">${val}</text></g>`;
}
function bigNum(x,y,text,size,col,k,rot=0){
  if(k<=0) return '';
  return `<g transform="translate(${f(x)} ${f(y)}) rotate(${rot}) scale(${f(k)})"><text text-anchor="middle" font-size="${size}" fill="${col}" class="cap" style="stroke-width:${size*.15}px">${text}</text></g>`;
}
function card(x,y,w,h,k){ return `<rect x="${f(x-w/2)}" y="${f(y-h/2)}" width="${w}" height="${h}" rx="30" fill="#fff" stroke="${INK}" stroke-width="6" filter="url(#sh)" transform="translate(${f(x*(1-k))} ${f(y*(1-k))}) scale(${f(k)})" />`; }
function label(x,y,text,size,col='#fff',bg='#1E293B',k=1,rot=0){
  if(k<=0) return ''; MC0.font=`900 ${size}px P`; const w=MC0.measureText(text).width+size*.9;
  return `<g transform="translate(${f(x)} ${f(y)}) rotate(${rot}) scale(${f(k)})" filter="url(#sh)"><rect x="${f(-w/2)}" y="${f(-size*.85)}" width="${f(w)}" height="${f(size*1.5)}" rx="${f(size*.4)}" fill="${bg}"/><text x="0" y="${f(size*.32)}" text-anchor="middle" font-size="${size}" fill="${col}">${text}</text></g>`;
}
function confetti(t,t0,n=60){ const k=t-t0; if(k<0||k>3.2) return ''; let g='';
  for(let i=0;i<n;i++){const x=W/2+(rand(i,1)-.5)*1600*Math.min(1,k*2), y=-40+k*380*(.6+rand(i,2))+Math.sin(k*5+i)*20, c=['#F43F5E','#FDE047','#22C55E','#3B82F6','#F97316'][i%5];
    g+=`<rect x="${f(x)}" y="${f(y)}" width="18" height="10" fill="${c}" transform="rotate(${f(k*300+i*40)} ${f(x)} ${f(y)})"/>`;} return g; }
function leavesFalling(t,t0,dur,x0,y0,n=24){ const k=t-t0; if(k<0||k>dur) return ''; let g='';
  for(let i=0;i<n;i++){const st=rand(i,7)*dur*.6, kk=k-st; if(kk<0) continue; const x=x0+(rand(i,3)-.3)*500+kk*260, y=y0+(rand(i,4)-.5)*200+kk*kk*120+kk*60;
    if(y>GY+40) continue; g+=`<ellipse cx="${f(x)}" cy="${f(y)}" rx="18" ry="10" fill="${i%3?'#2E9E4F':'#FFD23F'}" stroke="${INK}" stroke-width="3" transform="rotate(${f(kk*400+i*30)} ${f(x)} ${f(y)})"/>`;} return g; }
function captions(t){
  let line=null; for(const s of TL.scenes) for(const l of s.lines) if(t>=l.start-.05 && t<=l.start+l.dur+.25) line=l;
  if(!line||!line.words.length) return '';
  const ws=line.words; let i=0; for(let k=0;k<ws.length;k++) if(t>=ws[k].s-.05) i=k;
  const c0=Math.floor(i/6)*6, chunk=ws.slice(c0,c0+6), size=54; MC0.font=`900 ${size}px P`;
  const wd=chunk.map(w=>MC0.measureText(w.w.toUpperCase()).width+size*.36), tot=wd.reduce((a,b)=>a+b,0);
  let x=W/2-tot/2, g=`<rect y="880" width="${W}" height="200" fill="url(#capfade)"/>`;
  chunk.forEach((w,k)=>{ const cx=x+wd[k]/2; x+=wd[k]; if(t<w.s-.05) return; const on=c0+k===i;
    g+=`<text x="${f(cx)}" y="1030" text-anchor="middle" font-size="${size}" fill="${on?'#FFD21F':'#fff'}" class="cap">${w.w.toUpperCase()}</text>`; });
  return g;
}
// tree value keyframes [time, value]; built once from the timeline
let TREEK=[];
function treeVal(t){ let v=TREEK[0][1]; for(let i=1;i<TREEK.length;i++){ const [t0,v0]=TREEK[i-1],[t1,v1]=TREEK[i]; if(t>=t1) v=v1; else if(t>t0){ v=v0+(v1-v0)*eio((t-t0)/(t1-t0)); break; } } return v; }

// ------------------------------------------------------------ story #2 scenes ---
let OV='';               // overlay layer (not affected by the camera)
const ov=s=>{OV+=s;};
const POS={};            // per-scene speaker x positions for the camera
function rain(t,k=1,n=70){ if(k<=0) return ''; let g=''; for(let i=0;i<n*k;i++){const x=((i*131+t*300)%2100)-90, y=((i*71+t*1500)%1200)-60; g+=`<line x1="${f(x)}" y1="${f(y)}" x2="${f(x-10)}" y2="${f(y+44)}" stroke="#BFDBFE" stroke-width="4" opacity=".55" stroke-linecap="round"/>`;} return g; }
function nightSky(){ return `<defs><linearGradient id="ng" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B1026"/><stop offset="1" stop-color="#27304F"/></linearGradient></defs><rect width="${W}" height="${H}" fill="url(#ng)"/><circle cx="1650" cy="160" r="60" fill="#E2E8F0" opacity=".25"/>`; }
function street(){ return `<rect y="${GY}" width="${W}" height="${H-GY}" fill="#1E293B"/><rect y="${GY}" width="${W}" height="10" fill="#334155"/>`+Array.from({length:8},(_,i)=>`<ellipse cx="${i*260+80}" cy="${GY+90}" rx="90" ry="10" fill="#64748B" opacity=".35"/>`).join(''); }
function office(){ let g=`<rect width="${W}" height="${H}" fill="#E8EEF6"/><rect y="${GY}" width="${W}" height="${H-GY}" fill="#94A3B8"/><rect y="${GY}" width="${W}" height="12" fill="#64748B"/>`;
  g+=`<rect x="120" y="140" width="520" height="320" rx="12" fill="#BAE6FD" stroke="${INK}" stroke-width="6"/><path d="M380 140 L380 460 M120 300 L640 300" stroke="${INK}" stroke-width="5"/>`;
  g+=`<rect x="1300" y="160" width="360" height="200" rx="10" fill="#fff" stroke="${INK}" stroke-width="5"/><text x="1480" y="250" text-anchor="middle" font-size="40" fill="#2563EB">BLUEBIRD</text><text x="1480" y="300" text-anchor="middle" font-size="30" fill="#64748B" style="font-weight:700">LOGISTICS</text>`;
  return g; }
function desk(x){ return `<rect x="${x-260}" y="${GY-170}" width="520" height="40" rx="8" fill="#B45309" stroke="${INK}" stroke-width="6"/><rect x="${x-240}" y="${GY-130}" width="24" height="130" fill="#78350F"/><rect x="${x+216}" y="${GY-130}" width="24" height="130" fill="#78350F"/><rect x="${x-90}" y="${GY-300}" width="180" height="120" rx="10" fill="#1E293B" stroke="${INK}" stroke-width="5"/><rect x="${x-14}" y="${GY-180}" width="28" height="14" fill="#1E293B"/>`; }
function apartment(){ return `<rect width="${W}" height="${H}" fill="#FDE7C7"/><rect y="${GY}" width="${W}" height="${H-GY}" fill="#B98B5E"/><rect y="${GY}" width="${W}" height="12" fill="#8B6340"/><rect x="1500" y="180" width="300" height="260" rx="10" fill="#1E3A8A" stroke="${INK}" stroke-width="6"/><circle cx="1650" cy="300" r="40" fill="#E2E8F0" opacity=".5"/>`; }
function park(){ return sky(0)+`<rect y="${GY}" width="${W}" height="${H-GY}" fill="#475569"/>`+Array.from({length:6},(_,i)=>`<rect x="${i*340+60}" y="${GY+60}" width="160" height="12" fill="#F8FAFC"/>`).join(''); }
function bigReveal(x,y,text,size,col,k){ return bigNum(x,y,text,size,col,k); }
function heart(x,y,s,k=1){ if(k<=0) return ''; return `<g transform="translate(${f(x)} ${f(y)}) scale(${f(s*k)})"><path d="M0 30 C-60 -10 -40 -60 0 -30 C40 -60 60 -10 0 30Z" fill="#F43F5E" stroke="${INK}" stroke-width="4"/></g>`; }
function cloudOver(x,y,t){ return `<g transform="translate(${f(x)} ${f(y+Math.sin(t*3)*6)})"><circle cx="-50" cy="0" r="45" fill="#64748B"/><circle cx="10" cy="-20" r="55" fill="#64748B"/><circle cx="60" cy="0" r="42" fill="#64748B"/>${[0,1,2,3].map(i=>`<line x1="${-50+i*35}" y1="${45+((t*300+i*30)%60)}" x2="${-56+i*35}" y2="${70+((t*300+i*30)%60)}" stroke="#93C5FD" stroke-width="5"/>`).join('')}</g>`; }
function chart401(t,t0,pts,x0,y0,w,h,maxV,k,col='#16A34A'){ // pts: [[u 0..1, value]], drawn up to progress k
  const n=Math.max(2,Math.ceil(pts.length*k)), sub=pts.slice(0,n);
  let g=`<rect x="${x0-40}" y="${y0-h-60}" width="${w+80}" height="${h+110}" rx="24" fill="#fff" stroke="${INK}" stroke-width="6" filter="url(#sh)"/><line x1="${x0}" y1="${y0}" x2="${x0+w}" y2="${y0}" stroke="${INK}" stroke-width="5"/>`;
  g+=`<path d="M${sub.map(p=>f(x0+p[0]*w)+' '+f(y0-p[1]/maxV*h)).join(' L')}" stroke="${col}" stroke-width="12" fill="none" stroke-linejoin="round" stroke-linecap="round"/>`;
  const l=sub[sub.length-1]; g+=`<circle cx="${f(x0+l[0]*w)}" cy="${f(y0-l[1]/maxV*h)}" r="16" fill="${col}" stroke="#fff" stroke-width="5"/>`;
  return g; }
// ------------------------------------------------------------ story #3 scenes ---
const SCN={};
function lawOffice(){ return `<rect width="${W}" height="${H}" fill="#EDE4D3"/><rect y="${GY}" width="${W}" height="${H-GY}" fill="#8B6340"/><rect y="${GY}" width="${W}" height="12" fill="#6B4A2E"/>`+
  `<rect x="140" y="150" width="380" height="300" rx="8" fill="#7C2D12" stroke="${INK}" stroke-width="6"/>`+[0,1,2,3].map(i=>`<rect x="160" y="${170+i*70}" width="340" height="12" fill="#B45309"/>${[0,1,2,3,4,5,6].map(j=>`<rect x="${170+j*46}" y="${120+i*70+52}" width="30" height="${40+(j*7)%18}" fill="${['#1E3A8A','#B91C1C','#065F46','#92400E'][(i+j)%4]}"/>`).join('')}`).join('')+
  `<rect x="1420" y="160" width="320" height="200" rx="6" fill="#F8FAFC" stroke="${INK}" stroke-width="5"/><text x="1580" y="240" text-anchor="middle" font-size="34" fill="#334155">KOWALSKI</text><text x="1580" y="290" text-anchor="middle" font-size="26" fill="#64748B" style="font-weight:700">ATTORNEY AT LAW</text>`; }
function bigDesk(x=960){ return `<rect x="${x-380}" y="${GY-200}" width="760" height="50" rx="10" fill="#92400E" stroke="${INK}" stroke-width="6"/><rect x="${x-360}" y="${GY-150}" width="720" height="150" fill="#78350F" stroke="${INK}" stroke-width="6"/>`; }
function vault(){ let g=`<rect width="${W}" height="${H}" fill="#475569"/><rect y="${GY}" width="${W}" height="${H-GY}" fill="#334155"/>`;
  for(let i=0;i<8;i++) for(let j=0;j<5;j++) g+=`<rect x="${40+i*240}" y="${60+j*120}" width="220" height="100" rx="8" fill="#94A3B8" stroke="${INK}" stroke-width="4"/><circle cx="${150+i*240}" cy="${110+j*120}" r="10" fill="#FDE047" stroke="${INK}" stroke-width="3"/>`;
  return g+`<rect y="0" width="${W}" height="${H}" fill="#0F172A" opacity=".35"/>`; }
function kitchen(){ return `<rect width="${W}" height="${H}" fill="#FDE7C7"/><rect y="${GY}" width="${W}" height="${H-GY}" fill="#C08A5B"/><rect y="${GY}" width="${W}" height="12" fill="#8B6340"/>`+
  `<rect x="1300" y="200" width="460" height="40" fill="#92400E" stroke="${INK}" stroke-width="5"/>`; }
function court(){ return `<rect width="${W}" height="${H}" fill="#E7E5E4"/><rect y="${GY}" width="${W}" height="${H-GY}" fill="#78716C"/>`+
  `<rect x="660" y="200" width="600" height="${GY-200}" fill="#78350F" stroke="${INK}" stroke-width="7"/><rect x="700" y="160" width="520" height="60" rx="8" fill="#92400E" stroke="${INK}" stroke-width="6"/>`+
  `<circle cx="960" cy="110" r="60" fill="#FDE047" stroke="${INK}" stroke-width="6"/><text x="960" y="128" text-anchor="middle" font-size="52" fill="#78350F">⚖</text>`; }
function sepia(k){ return k>0?`<rect width="${W}" height="${H}" fill="#C08A5B" opacity="${f(.28*k)}" style="mix-blend-mode:multiply"/><rect width="${W}" height="${H}" fill="url(#capfade)" opacity="${f(.3*k)}"/>`:''; }
function storm_jar(x,y,s=1){ return jar({x,y,s,bills:3,label:'STORM JAR'}); }
function judge(x,y,t,o={}){ return CAST.kowalski(Object.assign({x,y,t,h:520,hair:'#E5E7EB',shirt:'#111827',pants:'#111827',hairStyle:'curly',mood:'happy'},o)); }

SCN.open=(t,s,L)=>{
  Object.assign(POS,{K:960,D:560,L:1380});
  let g=lawOffice()+bigDesk(960);
  g+=CAST.kowalski({x:960,y:GY-150,t,talk:talkOf(t,'K'),mood:'happy'});
  g+=CAST.derek({x:560,y:GY,t,talk:talkOf(t,'D'),mood:t>L[2]?'shocked':'happy',act:t>L[2]&&t<L[3]+.4?'shock':undefined,actT:L[2],look:[1,0]});
  g+=CAST.lily({x:1380,y:GY,t,talk:talkOf(t,'L'),mood:t>L[2]&&t<L[7]?'shocked':'happy',look:[-1,0]});
  g+=`<rect x="900" y="${GY-215}" width="120" height="16" fill="#fff" stroke="${INK}" stroke-width="3"/>`;
  if(t>=L[2]&&t<L[5]){ ov(bigNum(960,220,countUp(t,L[2]+.3,1.6,TL.N.now,v=>'$'+Math.round(v).toLocaleString('en-US')),120,'#FDE047',pop(t,L[2]+.2))+shockwave(t,L[2]+1.9,960,180,520,'#FDE047')); }
  if(t>=L[3]&&t<L[5]) ov(bubble({x:620,y:330,text:'SOUP. EVERY. NIGHT!',size:40,k:pop(t,L[3]+.5)}));
  if(t>=L[4]&&t<L[6]) ov(label(1640,150,'11 SAFETY PINS',46,'#fff','#475569',pop(t,L[4]+1.4)));
  if(t>=L[5]&&t<L[6]){ const k=pop(t,L[5]); ov(`<g transform="translate(1500 470) scale(${f(k)})"><circle r="240" fill="#FEF3C7" stroke="${INK}" stroke-width="8" filter="url(#sh)"/><clipPath id="cw"><circle r="235"/></clipPath><g clip-path="url(#cw)">${CAST.walter({x:0,y:560,h:720,t,mood:'happy',act:'think'})}</g></g>`+label(1500,770,'WALTER · SCHOOL JANITOR',38,'#fff','#7C5A3A',k)); }
  if(t>=L[6]&&t<L[7]) ov(bigNum(960,250,'HOW?',150,'#E11D48',pop(t,L[6]+.6)));
  if(t>=L[7]&&t<L[9]){ const p=eo(seg(t,L[7]+.3,L[7]+2.2)); g+=`<g transform="translate(${f(lerp(960,1260,p))} ${GY-212}) rotate(${f(p*90)})"><circle r="16" fill="none" stroke="#FDE047" stroke-width="7"/><rect x="10" y="-5" width="60" height="10" fill="#FDE047"/><rect x="50" y="5" width="8" height="14" fill="#FDE047"/></g>`;

function camera(t){
